[project]
name = "genlingo-duel"
version = "0.1.0"
description = "Genlingo duel service: David (local Gemma via Ollama) vs. Goliath (Gemini on Vertex AI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.35",
    "httpx>=0.28",
    "google-genai>=2.20",
    "sacrebleu>=2.5",
    "python-dotenv>=1.1",
    "google-cloud-firestore>=2.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genlingo_duel", "duel_core"]

[tool.pytest.ini_options]
testpaths = ["tests", "duel_core/tests", "../scripts/tests"]
asyncio_mode = "auto"
