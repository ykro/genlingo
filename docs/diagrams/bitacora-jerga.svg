<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 522" role="img" aria-labelledby="bj-title bj-desc" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="bj-title">Jerga resuelta por iteración de David</title>
  <desc id="bj-desc">Porcentaje de las 399 frases del set de prueba en que cada versión resolvió la jerga, en orden cronológico: Gemma 4 E2B base 58 %, base con glosario 62 %, David 2026-09 62 %, David 2026-10 en Q4 67 %, David 2026-10 en Q5_K_M 74 %, David 2026-10b con datos reales 82 %, David 2026-10c-nomulti con contrapartes por significado 82 % (en escena; su jerga correcta sube de 34 % a 42 %). Referencias: Goliath 78 % y Goliath con el mismo glosario 82 %.</desc>
  <rect width="960" height="522" fill="#f5f5f5"/>
  <text x="40" y="36" fill="#2d3142" font-size="15" font-weight="600">Jerga resuelta por iteración (mismo set de prueba, 399 frases)</text>
  <text x="40" y="56" fill="#4f5d75" font-size="11">Cada barra es una versión de David, en orden cronológico; las líneas punteadas son Goliath.</text>
  <!-- axis: x = 300 + pct * 5.6 -->
  <g stroke="#2d3142" stroke-opacity="0.08" stroke-width="1">
    <line x1="300" y1="78" x2="300" y2="452"/><line x1="440" y1="78" x2="440" y2="452"/>
    <line x1="580" y1="78" x2="580" y2="452"/><line x1="720" y1="78" x2="720" y2="452"/>
    <line x1="860" y1="78" x2="860" y2="452"/>
  </g>
  <g fill="#4f5d75" font-size="10" text-anchor="middle">
    <text x="300" y="470">0 %</text><text x="440" y="470">25 %</text><text x="580" y="470">50 %</text>
    <text x="720" y="470">75 %</text><text x="860" y="470">100 %</text>
  </g>
  <!-- reference lines: Goliath 78 %, Goliath + glosario 82 % -->
  <line x1="736.8" y1="78" x2="736.8" y2="452" stroke="#2e5aa8" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="759.2" y1="78" x2="759.2" y2="452" stroke="#2e5aa8" stroke-width="2" stroke-dasharray="1,3"/>
  <text x="732" y="492" fill="#2d3142" font-size="10" text-anchor="end">Goliath 78 %</text>
  <text x="764" y="492" fill="#2d3142" font-size="10" text-anchor="start">Goliath + glosario 82 %</text>
  <!-- bars (height 30, gap 22) -->
  <g font-size="12">
    <rect x="300" y="88" width="324.8" height="30" rx="4" fill="#2d3142" fill-opacity="0.06" stroke="#2d3142" stroke-opacity="0.35" stroke-dasharray="4,3"/>
    <text x="288" y="102" fill="#2d3142" text-anchor="end" font-weight="600">Gemma 4 E2B base</text>
    <text x="288" y="115" fill="#4f5d75" font-size="10" text-anchor="end">sin afinar</text>
    <text x="632.8" y="108" fill="#2d3142">58 %</text>

    <rect x="300" y="140" width="347.2" height="30" rx="4" fill="#2d3142" fill-opacity="0.06" stroke="#2d3142" stroke-opacity="0.35" stroke-dasharray="4,3"/>
    <text x="288" y="154" fill="#2d3142" text-anchor="end" font-weight="600">Base + glosario</text>
    <text x="288" y="167" fill="#4f5d75" font-size="10" text-anchor="end">solo el banco de términos</text>
    <text x="655.2" y="160" fill="#2d3142">62 %</text>

    <rect x="300" y="192" width="347.2" height="30" rx="4" fill="#4f5d75" fill-opacity="0.18" stroke="#4f5d75"/>
    <text x="288" y="206" fill="#2d3142" text-anchor="end" font-weight="600">2026-09 · pares mínimos</text>
    <text x="288" y="219" fill="#4f5d75" font-size="10" text-anchor="end">edición mínima · prompt básico · Q4_K_M</text>
    <text x="655.2" y="212" fill="#2d3142">62 %</text>

    <rect x="300" y="244" width="375.2" height="30" rx="4" fill="#4f5d75" fill-opacity="0.18" stroke="#4f5d75"/>
    <text x="288" y="258" fill="#2d3142" text-anchor="end" font-weight="600">2026-10 · anclados + glosario</text>
    <text x="288" y="271" fill="#4f5d75" font-size="10" text-anchor="end">pares anclados en el banco · Q4_K_M</text>
    <text x="683.2" y="264" fill="#2d3142">67 %</text>

    <rect x="300" y="296" width="414.4" height="30" rx="4" fill="#4f5d75" fill-opacity="0.18" stroke="#4f5d75"/>
    <text x="288" y="310" fill="#2d3142" text-anchor="end" font-weight="600">2026-10 · Q5_K_M</text>
    <text x="288" y="323" fill="#4f5d75" font-size="10" text-anchor="end">mismo modelo, mejor compresión</text>
    <text x="706" y="316" fill="#2d3142" text-anchor="end">74 %</text>

    <rect x="300" y="348" width="459.2" height="30" rx="4" fill="#4f5d75" fill-opacity="0.18" stroke="#4f5d75"/>
    <text x="288" y="362" fill="#2d3142" text-anchor="end" font-weight="600">2026-10b · datos reales</text>
    <text x="288" y="375" fill="#4f5d75" font-size="10" text-anchor="end">334 pares reales · Q5_K_M · jerga correcta 34 %</text>
    <text x="767.2" y="368" fill="#2d3142">82 %</text>

    <rect x="300" y="400" width="459.2" height="30" rx="4" fill="#C23D19" fill-opacity="0.14" stroke="#C23D19" stroke-width="1.5"/>
    <text x="288" y="414" fill="#C23D19" text-anchor="end" font-weight="700">2026-10c · por significado</text>
    <text x="288" y="427" fill="#4f5d75" font-size="10" text-anchor="end">jerga correcta 42 % · en escena</text>
    <text x="767.2" y="420" fill="#2d3142" font-weight="700">82 %</text>
  </g>
</svg>
